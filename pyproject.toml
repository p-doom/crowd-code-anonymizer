[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowd-pilot-anonymizer"
version = "0.1.0"
description = "Robust CSV anonymization tool for crowd-sourced software engineering traces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "pdoom-org" }
]
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "detect-secrets>=1.4",
    "pandas>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
anonymize = "anonymizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

