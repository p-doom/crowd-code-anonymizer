[package]
name = "anonymizer"
version = "0.1.0"
edition = "2021"
description = "Fast CSV anonymization tool for crowd-sourced software engineering traces"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# CSV processing
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regex
regex = "1.10"
once_cell = "1.19"

# Parallel processing
rayon = "1.10"

# Terminal UI for review mode
crossterm = "0.28"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Progress bar
indicatif = { version = "0.17", features = ["rayon"] }

# Directory walking
walkdir = "2.5"

# Unicode normalization for name matching
unicode-normalization = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

